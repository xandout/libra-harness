name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip commits made by the bot (version bumps) to avoid release loops.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
        env:
          CI: true

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s"
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Bump lc version (match root)
        run: |
          cd extras/libra-code
          npm version patch -m "chore: lc release v%s"
        env:
          VERSION: ${{ env.VERSION }}

      - name: Push version tags
        run: git push --follow-tags

      - name: Publish libra-harness to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish libra-harness to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
          npm publish --access public --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish libra-code to npm
        run: |
          cd extras/libra-code
          # Build from the local workspace (link dep resolves to ../../dist).
          pnpm build
          # Replace the link dep with a real version range for the
          # published package. npm publish doesn't install deps — it
          # just packs dist + package.json — so we don't need to
          # re-install from NPM.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.dependencies['@xandout/libra-harness'] = '^' + process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ env.VERSION }}

      - name: Publish libra-code to GitHub Packages
        run: |
          cd extras/libra-code
          npm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
          npm publish --access public --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
