name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip commits made by the bot (version bumps) to avoid release loops.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
        env:
          CI: true

      - name: Bump versions and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          VERSION=$(node <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
          let [major, minor, patch] = pkg.version.split('.').map(Number);

          function tagExists(tag) {
            try {
              const res = execSync(`git tag -l "${tag}"`, { encoding: 'utf-8' }).trim();
              return res.length > 0;
            } catch {
              return false;
            }
          }

          function npmVersionExists(pkgName, ver) {
            try {
              const res = execSync(`npm view "${pkgName}@${ver}" version`, { encoding: 'utf-8' }).trim();
              return res === ver;
            } catch {
              return false;
            }
          }

          let nextPatch = patch;
          let targetVer = `${major}.${minor}.${nextPatch}`;

          while (true) {
            const tag = `v${targetVer}`;
            const harnessOnNpm = npmVersionExists('@xandout/libra-harness', targetVer);
            const codeOnNpm = npmVersionExists('@xandout/libra-code', targetVer);
            const hasTag = tagExists(tag);

            if (!hasTag && !harnessOnNpm && !codeOnNpm) {
              break;
            }
            console.error(`Version ${targetVer} already exists (tag: ${hasTag}, harness: ${harnessOnNpm}, code: ${codeOnNpm}). Incrementing...`);
            nextPatch++;
            targetVer = `${major}.${minor}.${nextPatch}`;
          }

          console.log(targetVer);
          EOF
          )

          echo "Selected VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Set package.json versions and rewrite workspace dependency for distribution
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const ver = process.env.VERSION;

            const p1 = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            p1.version = ver;
            fs.writeFileSync('package.json', JSON.stringify(p1, null, 2) + '\n');

            const p2 = JSON.parse(fs.readFileSync('extras/libra-code/package.json', 'utf-8'));
            p2.version = ver;
            p2.dependencies['@xandout/libra-harness'] = '^' + ver;
            fs.writeFileSync('extras/libra-code/package.json', JSON.stringify(p2, null, 2) + '\n');
          "

          git add package.json extras/libra-code/package.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"

      - name: Push version tags
        run: git push --follow-tags

      - name: Build release tarballs (.tgz)
        run: |
          pnpm build
          npm pack
          cd extras/libra-code && pnpm build && npm pack && mv *.tgz ../.. && cd ../..

      - name: Create GitHub release with tarball assets (INSTANT)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: |
            *.tgz
          generate_release_notes: true

      - name: Publish libra-harness to GitHub Packages (INSTANT)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@xandout'
      - run: |
          VERSION="${{ env.VERSION }}"
          if npm view "@xandout/libra-harness@${VERSION}" version 2>/dev/null | grep -q "$VERSION"; then
            echo "@xandout/libra-harness@${VERSION} already published on GitHub Packages. Skipping."
          else
            npm publish --access public || true
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish libra-code to GitHub Packages (INSTANT)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@xandout'
      - run: |
          cd extras/libra-code
          VERSION="${{ env.VERSION }}"
          if npm view "@xandout/libra-code@${VERSION}" version 2>/dev/null | grep -q "$VERSION"; then
            echo "@xandout/libra-code@${VERSION} already published on GitHub Packages. Skipping."
          else
            npm publish --access public || true
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Slow public npm publishing tasks run LAST ──

      - name: Publish libra-harness to public npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          VERSION="${{ env.VERSION }}"
          if npm view "@xandout/libra-harness@${VERSION}" version 2>/dev/null | grep -q "$VERSION"; then
            echo "@xandout/libra-harness@${VERSION} already published on npm. Skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify harness is published on public npm
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Waiting for @xandout/libra-harness@${VERSION} to appear on public npm..."
          for i in $(seq 1 40); do
            if npm view "@xandout/libra-harness@${VERSION}" version 2>/dev/null | grep -q "$VERSION"; then
              echo "Found @xandout/libra-harness@${VERSION} on npm"
              exit 0
            fi
            echo "  attempt $i — not yet visible, waiting 10s..."
            sleep 10
          done
          echo "ERROR: @xandout/libra-harness@${VERSION} never appeared on npm"
          exit 1

      - name: Build and publish libra-code to public npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          cd extras/libra-code
          pnpm build
          VERSION="${{ env.VERSION }}"
          if npm view "@xandout/libra-code@${VERSION}" version 2>/dev/null | grep -q "$VERSION"; then
            echo "@xandout/libra-code@${VERSION} already published on npm. Skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ env.VERSION }}
