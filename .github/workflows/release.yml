name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  harness:
    runs-on: ubuntu-latest
    # Skip commits made by the bot (version bumps) to avoid release loops.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
        env:
          CI: true

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s"
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set lc version to match root
        run: |
          cd extras/libra-code
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git add package.json
        env:
          VERSION: ${{ env.VERSION }}

      - name: Push version tags
        run: git push --follow-tags

      - name: Publish libra-harness to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish libra-harness to GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@xandout'
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true

  libra-code:
    runs-on: ubuntu-latest
    needs: harness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Verify harness is published on npm
        run: |
          VERSION="${{ needs.harness.outputs.version }}"
          echo "Waiting for @xandout/libra-harness@${VERSION} to appear on npm..."
          for i in $(seq 1 30); do
            if npm view "@xandout/libra-harness@${VERSION}" version 2>/dev/null | grep -q "$VERSION"; then
              echo "Found @xandout/libra-harness@${VERSION} on npm"
              exit 0
            fi
            echo "  attempt $i — not yet visible, waiting 10s..."
            sleep 10
          done
          echo "ERROR: @xandout/libra-harness@${VERSION} never appeared on npm"
          exit 1

      - name: Build and publish libra-code to npm
        run: |
          cd extras/libra-code
          pnpm build
          # Replace the link dep with the published version range.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.dependencies['@xandout/libra-harness'] = '^' + process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.harness.outputs.version }}

      - name: Publish libra-code to GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@xandout'
      - run: |
          cd extras/libra-code
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
